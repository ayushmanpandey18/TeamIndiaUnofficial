<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login – BCCI</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Jost:wght@300;400&display=swap" rel="stylesheet"/>
<style>
  :root { --gold:#c9a84c; --dark:#0a0a0a; --dark2:#111; --white:#f5f0e8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--dark);
    color: var(--white);
    font-family: 'Jost', sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background-image: radial-gradient(ellipse at 50% 50%, rgba(201,168,76,0.08), transparent 70%);
  }
  .login-box {
    background: #111;
    border: 1px solid rgba(201,168,76,0.25);
    padding: 60px 50px;
    width: 420px;
    text-align: center;
  }
  .logo {
    font-family: 'Cinzel', serif;
    font-size: 24px;
    letter-spacing: 4px;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .subtitle { font-size: 12px; letter-spacing: 3px; color: #666; text-transform: uppercase; margin-bottom: 40px; }
  .form-group { margin-bottom: 20px; text-align: left; }
  label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #888; display: block; margin-bottom: 8px; }
  input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(201,168,76,0.2);
    color: var(--white);
    padding: 14px 18px;
    font-family: 'Jost', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.3s;
  }
  input:focus { border-color: var(--gold); }
  input::placeholder { color: #444; }
  .btn {
    width: 100%;
    background: var(--gold);
    color: #000;
    border: none;
    padding: 16px;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.3s;
  }
  .btn:hover { background: #e8c97a; }
  .error-msg {
    background: rgba(192,57,43,0.15);
    border: 1px solid rgba(192,57,43,0.4);
    color: #e74c3c;
    padding: 12px;
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
  }
  .error-msg.show { display: block; }
  .back-link { display: block; margin-top: 24px; font-size: 12px; color: #555; text-decoration: none; letter-spacing: 1px; }
  .back-link:hover { color: var(--gold); }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">BCCI</div>
  <div class="subtitle">Admin Panel</div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="admin@teamindia.com" value="admin@teamindia.com"/>
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Admin@123" onkeypress="if(event.key==='Enter') login()"/>
  </div>
  <button class="btn" onclick="login()">Login →</button>
  <a class="back-link" href="/">← Back to Website</a>
</div>
<script>
  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('errorMsg');
    errEl.classList.remove('show');
    if (!email || !password) {
      errEl.textContent = 'Please enter email and password.';
      errEl.classList.add('show');
      return;
    }
    try {
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = data.redirect;
      } else {
        errEl.textContent = data.message;
        errEl.classList.add('show');
      }
    } catch (e) {
      errEl.textContent = 'Server error. Please try again.';
      errEl.classList.add('show');
    }
  }
</script>
</body>
</html>
